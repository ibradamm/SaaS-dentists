# Pile « staging local » : les images de production (infra/docker) derrière un proxy de
# périmètre simulé (edge.Caddyfile : TLS, redirection HTTP → HTTPS, X-Real-IP écrasé), en
# APP_ENV=staging (cookies __Host- et Secure). Sert à exercer check:deployment sans hébergeur
# (CI : job « Pile staging locale »). Données synthétiques uniquement.
#
#   infra/staging-local/certs.sh infra/staging-local/.certs
#   export PG_ADMIN_PASSWORD=… DATABASE_OWNER_PASSWORD=… DATABASE_APP_PASSWORD=… DATA_ENCRYPTION_KEY=…
#   docker compose -f infra/staging-local/compose.yml up -d --build --wait
#
# Ne remplace pas la vérification sur l'hébergement réel : le proxy de l'hébergeur y est
# différent, et c'est lui que check:deployment doit vérifier.
name: dental-staging-local

x-server: &server
  image: dental-server:local
  build:
    context: ../..
    dockerfile: infra/docker/server.Dockerfile
  networks: [back]

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?}
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 2s
      retries: 30
    networks: [back]

  bootstrap:
    <<: *server
    command: ['node', 'dist/bootstrap.js']
    environment:
      APP_ENV: staging
      DATABASE_ADMIN_URL: postgres://postgres:${PG_ADMIN_PASSWORD}@postgres:5432/postgres
      DATABASE_NAME: dental
      DATABASE_OWNER_PASSWORD: ${DATABASE_OWNER_PASSWORD:?}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?}
    depends_on:
      postgres: { condition: service_healthy }

  migrate:
    <<: *server
    command: ['node', 'dist/migrate.js']
    environment:
      APP_ENV: staging
      DATABASE_MIGRATION_URL: postgres://dental_owner:${DATABASE_OWNER_PASSWORD}@postgres:5432/dental
    depends_on:
      bootstrap: { condition: service_completed_successfully }

  api:
    <<: *server
    environment:
      APP_ENV: staging
      DATABASE_URL: postgres://dental_app:${DATABASE_APP_PASSWORD}@postgres:5432/dental
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?}
      API_HOST: '::'
      API_PORT: '3000'
      API_TRUST_PROXY_HOPS: '1'
      WEB_ORIGIN: https://localhost
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      retries: 30
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *server
    command: ['node', 'dist/main-worker.js']
    environment:
      APP_ENV: staging
      DATABASE_URL: postgres://dental_app:${DATABASE_APP_PASSWORD}@postgres:5432/dental
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: dental-web:local
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      PORT: '8080'
      API_UPSTREAM: api:3000
      # Seul le proxy de périmètre peut fournir l'adresse du client.
      CADDY_TRUSTED_PROXIES: 172.28.0.10/32
    depends_on:
      api: { condition: service_healthy }
    networks: [back]

  edge:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      EDGE_UPSTREAM: web:8080
    volumes:
      - ./edge.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.certs:/certs:ro
    ports:
      - '80:80'
      - '443:443'
    depends_on: [web]
    networks:
      back:
        ipv4_address: 172.28.0.10

networks:
  back:
    ipam:
      config:
        - subnet: 172.28.0.0/24
