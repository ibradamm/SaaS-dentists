# Environnement de développement local : PostgreSQL 16 uniquement.
# Usage : docker compose -f infra/docker-compose.yml up -d
# Puis : pnpm db:bootstrap && pnpm db:migrate && pnpm db:seed
# Le mot de passe « postgres » est réservé au développement local (port lié à 127.0.0.1).
name: dental-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
